<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The tab gets the tile framing, which is the one that survives 16px;
         a home screen gets the whole mark, where the orbit still reads. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Classic Milk's paper, the theme the application opens on. The shell
         rewrites this as the theme changes (themes/apply-theme.ts). -->
    <meta name="theme-color" content="#f7f4ee" />
    <meta
      name="description"
      content="Practise where your hands slow down, on the words you actually type."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hover Typing</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
